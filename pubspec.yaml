name: bubbles
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  file_picker: ^10.2.0
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  image_picker: ^1.1.2
  riverpod: ^2.6.1
  supabase_flutter: ^2.9.1
    

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
  assets:
      - assets/bubbleImages/bubble.png
      - assets/bubbleImages/bubble6.png
      - assets/bubbleImages/bubble4.png
      - assets/bubbleImages/bubble5.png
      - assets/bubbleImages/bubble2.png
      - assets/bubbleImages/bubble3.png
      - assets/bubbleImages/bubbleIcon.png
      - assets/bubbleImages/bubbleIcon.svg
      - assets/otherIcons/
